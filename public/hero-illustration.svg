<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" fill="none">
  <!-- Halo -->
  <circle cx="240" cy="200" r="180" fill="#fff" fill-opacity="0.06"/>
  <circle cx="240" cy="200" r="130" fill="#fff" fill-opacity="0.08"/>

  <!-- Points décoratifs -->
  <circle cx="110" cy="90" r="5" fill="#fff" fill-opacity="0.5"/>
  <circle cx="90" cy="300" r="7" fill="#fff" fill-opacity="0.25"/>
  <circle cx="400" cy="340" r="4" fill="#fff" fill-opacity="0.5"/>

  <!-- Ombre du téléphone -->
  <ellipse cx="240" cy="366" rx="90" ry="10" fill="#0f172a" fill-opacity="0.25"/>

  <!-- Téléphone -->
  <rect x="170" y="50" width="140" height="300" rx="24" fill="#fff"/>
  <rect x="222" y="60" width="36" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="182" y="76" width="116" height="250" rx="10" fill="#eff6ff"/>

  <!-- Barres de réseau -->
  <rect x="206" y="150" width="12" height="20" rx="3" fill="#2563eb"/>
  <rect x="224" y="136" width="12" height="34" rx="3" fill="#2563eb"/>
  <rect x="242" y="122" width="12" height="48" rx="3" fill="#2563eb"/>
  <rect x="260" y="108" width="12" height="62" rx="3" fill="#1e3a8a"/>

  <!-- Carte de consommation -->
  <rect x="194" y="190" width="92" height="44" rx="8" fill="#fff"/>
  <rect x="204" y="202" width="40" height="6" rx="3" fill="#1e3a8a"/>
  <rect x="204" y="218" width="72" height="6" rx="3" fill="#dbeafe"/>
  <rect x="204" y="218" width="46" height="6" rx="3" fill="#2563eb"/>

  <!-- Bouton -->
  <rect x="194" y="250" width="92" height="28" rx="14" fill="#2563eb"/>
  <rect x="220" y="261" width="40" height="6" rx="3" fill="#fff"/>

  <!-- Ondes réseau -->
  <circle cx="328" cy="110" r="7" fill="#fff"/>
  <path d="M328 80a30 30 0 0 1 30 30" stroke="#fff" stroke-opacity="0.9" stroke-width="6" stroke-linecap="round"/>
  <path d="M328 54a56 56 0 0 1 56 56" stroke="#fff" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
  <path d="M328 28a82 82 0 0 1 82 82" stroke="#fff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>

  <!-- Vignette de gauche -->
  <rect x="50" y="150" width="104" height="56" rx="12" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4"/>
  <circle cx="76" cy="178" r="12" fill="#fff" fill-opacity="0.9"/>
  <rect x="98" y="168" width="44" height="6" rx="3" fill="#fff" fill-opacity="0.9"/>
  <rect x="98" y="182" width="30" height="6" rx="3" fill="#fff" fill-opacity="0.6"/>

  <!-- Vignette de droite : activation confirmée -->
  <rect x="326" y="236" width="108" height="60" rx="12" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4"/>
  <circle cx="352" cy="266" r="13" fill="#34d399"/>
  <path d="M346 266l4.5 4.5 8-9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="374" y="256" width="46" height="6" rx="3" fill="#fff" fill-opacity="0.9"/>
  <rect x="374" y="270" width="32" height="6" rx="3" fill="#fff" fill-opacity="0.6"/>
