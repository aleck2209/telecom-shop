<article class="plan-card">
  <h3 class="plan-name">{{ plan().name }}</h3>
  <p class="plan-description">{{ plan().description }}</p>
  <p class="plan-price">{{ plan().price | currency: 'XAF' }}</p>
  <p class="plan-meta">{{ plan().dataMb | dataVolume}} · {{ plan().validityDays }} jours</p>
  <button type="button" class="btn btn-primary plan-select" (click)="choose()">
    Choisir
  </button>
  @if (plan().promo) {
    <span class="badge-promo">Promo</span>
  }
</article>
