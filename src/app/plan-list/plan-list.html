<section class="plans" id="forfaits">
    <div class="container">
        <h2>Nos forfaits</h2>
        @if (plans.length > 0) {
            <p class="plans-count">{{plans.length}} forfaits disponibles</p>
            @if (selectedPlan) {
                <p class="plans-selection">Forfait sélectionné : {{selectedPlan.name}}</p>
            }
            <ul class="plans-grid">
                @for(plan of plans; track plan.id) {
                    <li>
                        <app-plan-card [plan]="plan" (selected)="selectPlan($event)"/>
                    </li>
                }
            </ul>
        } @else {
            <p class="empty-state">Aucun forfait disponible pour le moment.</p>
        }
    </div>
</section>
